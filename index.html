<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4ede2">
  <title>בר המצווה של איתן</title>
  <meta name="description" content="הזמנה לבר המצווה של איתן: פרטי האירוע, דרכי הגעה ואישור הגעה.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="he_IL">
  <meta property="og:title" content="בר המצווה של איתן">
  <meta property="og:description" content="נשמח לראותכם. פרטי האירוע, ניווט ואישור הגעה בקישור.">
  <meta property="og:url" content="https://3arnon.github.io/eitan-bar-mitzvah/">
  <meta property="og:image" content="https://3arnon.github.io/eitan-bar-mitzvah/images/preview.jpg">
  <meta property="og:image:width" content="1024">
  <meta property="og:image:height" content="538">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f2147'/%3E%3Cpath d='M16 6l8.7 15H7.3zM16 26L7.3 11h17.4z' fill='none' stroke='%23d6bd8b' stroke-width='1.6' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <filter id="wash" x="-30%" y="-30%" width="160%" height="160%">
        <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4" seed="11" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="80" xChannelSelector="R" yChannelSelector="G" result="rough"/>
        <feGaussianBlur in="rough" stdDeviation="1.4"/>
      </filter>

      <symbol id="divider" viewBox="0 0 240 24">
        <line x1="0" y1="12" x2="94" y2="12"/>
        <circle fill="currentColor" stroke="none" cx="100" cy="12" r="1.6"/>
        <g transform="translate(120 12) rotate(45)">
          <rect x="-8" y="-8" width="16" height="16"/>
          <rect fill="currentColor" stroke="none" x="-5.6" y="-5.6" width="4.4" height="4.4"/>
          <rect fill="currentColor" stroke="none" x="1.2" y="-5.6" width="4.4" height="4.4"/>
          <rect fill="currentColor" stroke="none" x="-5.6" y="1.2" width="4.4" height="4.4"/>
          <rect fill="currentColor" stroke="none" x="1.2" y="1.2" width="4.4" height="4.4"/>
        </g>
        <circle fill="currentColor" stroke="none" cx="140" cy="12" r="1.6"/>
        <line x1="146" y1="12" x2="240" y2="12"/>
      </symbol>

      <symbol id="flourish" viewBox="0 0 240 28">
        <path d="M18 16 C 44 16, 58 6, 74 12 C 82 15, 80 22, 73 20 M74 12 L 104 12"/>
        <path d="M222 16 C 196 16, 182 6, 166 12 C 158 15, 160 22, 167 20 M166 12 L 136 12"/>
        <path fill="currentColor" stroke="none" d="M120 22 C 111 15.5 108.5 10 112.6 7.2 C 115.4 5.3 118.8 6.7 120 9.6 C 121.2 6.7 124.6 5.3 127.4 7.2 C 131.5 10 129 15.5 120 22 Z"/>
      </symbol>

      <symbol id="icon-torah" viewBox="0 0 64 64">
        <rect x="8" y="15" width="9" height="34" rx="2.5"/>
        <rect x="47" y="15" width="9" height="34" rx="2.5"/>
        <path d="M12.5 15 V9 M12.5 49 V55 M51.5 15 V9 M51.5 49 V55"/>
        <circle cx="12.5" cy="7" r="2"/>
        <circle cx="12.5" cy="57" r="2"/>
        <circle cx="51.5" cy="7" r="2"/>
        <circle cx="51.5" cy="57" r="2"/>
        <path d="M17 19 Q32 23 47 19 M17 45 Q32 49 47 45"/>
        <path d="M23 28 H41 M23 33.5 H41 M23 39 H35"/>
      </symbol>

      <symbol id="icon-glasses" viewBox="0 0 64 64">
        <g transform="translate(21 33) rotate(15)">
          <path d="M-9 -15 H9 Q9 2 0 4 Q-9 2 -9 -15 Z"/>
          <path d="M-8.6 -7 Q-3 -10 2 -7 T8.6 -7"/>
          <path d="M0 4 V21 M-7 21 H7"/>
        </g>
        <g transform="translate(43 33) rotate(-15)">
          <path d="M-9 -15 H9 Q9 2 0 4 Q-9 2 -9 -15 Z"/>
          <path d="M-8.6 -7 Q-3 -10 2 -7 T8.6 -7"/>
          <path d="M0 4 V21 M-7 21 H7"/>
        </g>
        <path d="M32 5 V10 M25.5 7 L27.5 11.5 M38.5 7 L36.5 11.5"/>
      </symbol>
    </defs>
  </svg>

  <div class="draft-ribbon" id="draft-ribbon" hidden></div>

  <div class="sheet">
    <header class="hero">
      <h1 class="sr-only">בר המצווה של איתן</h1>
      <img class="hero__invitation" id="invitation" src="images/invitation.jpg" width="1024" height="1536" alt="">
    </header>

    <div class="panel">
      <span class="wash wash--top" aria-hidden="true"></span>
      <span class="wash wash--bottom" aria-hidden="true"></span>

      <div class="panel__frame">
        <figure class="portrait" id="portrait" hidden>
          <img id="photo" alt="">
        </figure>

        <section class="countdown" aria-labelledby="countdown-title">
          <h2 class="title" id="countdown-title">נפגשים בעוד</h2>
          <div class="countdown__grid" id="countdown-grid" role="timer">
            <div class="unit"><span class="unit__num" id="cd-days">0</span><span class="unit__label">ימים</span></div>
            <div class="unit"><span class="unit__num" id="cd-hours">0</span><span class="unit__label">שעות</span></div>
            <div class="unit"><span class="unit__num" id="cd-minutes">0</span><span class="unit__label">דקות</span></div>
            <div class="unit"><span class="unit__num" id="cd-seconds">0</span><span class="unit__label">שניות</span></div>
          </div>
          <p class="countdown__done" id="countdown-done" hidden>מזל טוב!</p>
          <p class="countdown__date">
            <span id="greg-date"></span>
            <span id="hebrew-date"></span>
          </p>
          <a class="btn btn--navy" href="#rsvp">לאישור הגעה</a>
        </section>

        <svg class="divider" aria-hidden="true"><use href="#divider"/></svg>

        <section class="blessing" aria-label="ברכה">
          <div id="blessing-text"></div>
        </section>

        <svg class="divider" aria-hidden="true"><use href="#divider"/></svg>

        <section class="schedule" aria-labelledby="schedule-title">
          <h2 class="sr-only" id="schedule-title">סדר היום</h2>
          <ol class="stops" id="stops"></ol>
        </section>

        <svg class="divider" aria-hidden="true"><use href="#divider"/></svg>

        <section class="rsvp" id="rsvp" aria-labelledby="rsvp-title">
          <h2 class="title" id="rsvp-title">אישור הגעה</h2>
          <p class="rsvp__deadline" id="rsvp-deadline" hidden></p>

          <form class="form" id="rsvp-form" novalidate>
            <div class="field">
              <label class="field__label" for="f-name">שם מלא</label>
              <input class="input" id="f-name" name="name" type="text" autocomplete="name" maxlength="80">
              <p class="field__error" id="err-name" hidden></p>
            </div>

            <fieldset class="field">
              <legend class="field__label">האם תגיעו?</legend>
              <div class="choices">
                <label class="choice"><input type="radio" name="attending" value="yes"><span>מגיעים בשמחה</span></label>
                <label class="choice"><input type="radio" name="attending" value="no"><span>לצערנו לא נוכל</span></label>
              </div>
              <p class="field__error" id="err-attending" hidden></p>
            </fieldset>

            <div id="attending-details" hidden>
              <div class="field">
                <label class="field__label" for="f-count">כמה תהיו?</label>
                <div class="stepper" dir="ltr">
                  <button type="button" class="stepper__btn" id="count-minus" aria-label="פחות">&minus;</button>
                  <input class="input stepper__input" id="f-count" name="count" type="number" inputmode="numeric" min="1" max="20" value="2">
                  <button type="button" class="stepper__btn" id="count-plus" aria-label="יותר">+</button>
                </div>
                <p class="field__error" id="err-count" hidden></p>
              </div>

              <fieldset class="field">
                <legend class="field__label">לאיזה חלק תגיעו?</legend>
                <div class="choices choices--stack">
                  <label class="choice"><input type="radio" name="part" value="both" checked><span>העלייה לתורה והאירוע</span></label>
                  <label class="choice"><input type="radio" name="part" value="synagogue"><span>העלייה לתורה בלבד</span></label>
                  <label class="choice"><input type="radio" name="part" value="event"><span>האירוע בלבד</span></label>
                </div>
              </fieldset>

              <div class="field">
                <label class="field__label" for="f-email">מייל לתזכורת <span class="field__optional">(רשות)</span></label>
                <input class="input" id="f-email" name="email" type="email" inputmode="email" autocomplete="email" maxlength="120" dir="ltr">
                <p class="field__hint">נשלח תזכורת אחת, יום לפני האירוע.</p>
                <p class="field__error" id="err-email" hidden></p>
              </div>
            </div>

            <div class="field">
              <label class="field__label" for="f-note">הערה <span class="field__optional">(רשות)</span></label>
              <textarea class="input" id="f-note" name="note" rows="3" maxlength="300" placeholder="למשל אלרגיות או רגישויות למזון"></textarea>
            </div>

            <div class="field--trap" aria-hidden="true">
              <label for="f-website">אין למלא שדה זה</label>
              <input id="f-website" name="website" type="text" tabindex="-1" autocomplete="off">
            </div>

            <button class="btn btn--navy btn--full" id="rsvp-submit" type="submit">שליחת אישור</button>
            <p class="form__status" id="rsvp-status" role="status" aria-live="polite"></p>
          </form>

          <div class="thanks" id="rsvp-thanks" tabindex="-1" hidden>
            <h3 class="thanks__title" id="thanks-title"></h3>
            <p id="thanks-text"></p>
            <button type="button" class="link-btn" id="rsvp-again">שליחת תשובה נוספת</button>
          </div>
        </section>

        <footer class="closing">
          <p class="closing__line" id="closing"></p>
          <p class="closing__signature" id="signature"></p>
          <svg class="flourish" aria-hidden="true"><use href="#flourish"/></svg>
        </footer>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
