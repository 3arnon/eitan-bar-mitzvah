<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4ede2">
  <title>בר המצווה של איתן</title>
  <meta name="description" content="הזמנה לבר המצווה של איתן: פרטי האירוע, דרכי הגעה ואישור הגעה.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="he_IL">
  <meta property="og:title" content="בר המצווה של איתן">
  <meta property="og:description" content="נשמח לראותכם. פרטי האירוע, ניווט ואישור הגעה בקישור.">
  <meta property="og:url" content="https://3arnon.github.io/eitan-bar-mitzvah/">
  <meta property="og:image" content="https://3arnon.github.io/eitan-bar-mitzvah/images/preview.jpg">
  <meta property="og:image:width" content="1024">
  <meta property="og:image:height" content="538">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f2147'/%3E%3Cpath d='M16 6l8.7 15H7.3zM16 26L7.3 11h17.4z' fill='none' stroke='%23d6bd8b' stroke-width='1.6' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap" rel="stylesheet">
  <!-- ?v= הוא מספר גרסה: מעלים אותו בכל עדכון, כדי שטלפונים לא יציגו עותק ישן של הקבצים -->
  <link rel="stylesheet" href="styles.css?v=20261026b">
  <script>
    // המעטפה מוצגת בכל כניסה. מי שביקש בטלפון פחות תנועה מקבל גרסה שקטה: המעטפה מתעמעמת לתוך ההזמנה
    try {
      var root = document.documentElement;
      root.classList.add("intro-on");
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) root.classList.add("intro-calm");
      // תמיד מתחילים מראש הדף, גם ברענון וגם אם בכתובת נשאר סימון של חלק בדף (למשל #details)
      if (location.hash) history.replaceState(null, "", location.pathname + location.search);
      history.scrollRestoration = "manual";
      // רשת ביטחון: גם אם משהו נתקע, ההזמנה לא נשארת מוסתרת
      setTimeout(function () {
        root.classList.remove("intro-on");
      }, 12000);
    } catch (e) {}
  </script>
</head>
<body>
  <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="divider" viewBox="0 0 240 24">
        <line x1="0" y1="12" x2="94" y2="12"/>
        <circle fill="currentColor" stroke="none" cx="100" cy="12" r="1.6"/>
        <g transform="translate(120 12) rotate(45)">
          <rect x="-8" y="-8" width="16" height="16"/>
          <rect fill="currentColor" stroke="none" x="-5.6" y="-5.6" width="4.4" height="4.4"/>
          <rect fill="currentColor" stroke="none" x="1.2" y="-5.6" width="4.4" height="4.4"/>
          <rect fill="currentColor" stroke="none" x="-5.6" y="1.2" width="4.4" height="4.4"/>
          <rect fill="currentColor" stroke="none" x="1.2" y="1.2" width="4.4" height="4.4"/>
        </g>
        <circle fill="currentColor" stroke="none" cx="140" cy="12" r="1.6"/>
        <line x1="146" y1="12" x2="240" y2="12"/>
      </symbol>

      <!-- סוכריה עטופה. הצבע נקבע מבחוץ (currentColor) -->
      <symbol id="icon-candy" viewBox="0 0 64 32">
        <path fill="currentColor" opacity="0.8" d="M15 16 L3 5 Q0 16 3 27 Z M49 16 L61 5 Q64 16 61 27 Z"/>
        <path fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="1" stroke-linecap="round" d="M6 9 L13 15.5 M6 23 L13 16.5 M58 9 L51 15.5 M58 23 L51 16.5"/>
        <ellipse fill="currentColor" cx="32" cy="16" rx="19" ry="12"/>
        <path fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2.4" stroke-linecap="round" d="M22 7 Q28 16 22 25 M32 4.5 Q38 16 32 27.5 M42 7 Q48 16 42 25"/>
        <ellipse fill="#fff" fill-opacity="0.35" cx="25" cy="10" rx="6" ry="2.6" transform="rotate(-14 25 10)"/>
      </symbol>

      <!-- חותמת שעווה כחולה עם מגן דוד ו-13 בזהב. הסמל שקוע בשעווה: צל בצד העליון ואור בצד התחתון -->
      <radialGradient id="wax" cx="38%" cy="32%" r="75%">
        <stop offset="0" stop-color="#5a86c6"/>
        <stop offset="0.45" stop-color="#1f4382"/>
        <stop offset="1" stop-color="#0b1a3d"/>
      </radialGradient>
      <radialGradient id="wax-pressed" cx="42%" cy="38%" r="70%">
        <stop offset="0" stop-color="#2b5596"/>
        <stop offset="1" stop-color="#173468"/>
      </radialGradient>
      <symbol id="seal-emblem" viewBox="0 0 120 120">
        <path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="miter" stroke-miterlimit="10" d="M60 36 L80.78 72 L39.22 72 Z M60 84 L39.22 48 L80.78 48 Z"/>
        <text x="60" y="64.4" direction="ltr" text-anchor="middle" fill="currentColor" font-family="Frank Ruhl Libre, David, serif" font-size="12.5" font-weight="900">13</text>
      </symbol>
      <linearGradient id="envelope-paper" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f6eee0"/>
        <stop offset="1" stop-color="#e8d8bb"/>
      </linearGradient>
      <radialGradient id="wax-gloss" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>

      <symbol id="seal-art" viewBox="0 0 120 120">
        <path fill="url(#wax)" d="M60.0 13.8 C65.8 13.8 71.8 15.9 77.4 18.0 C83.0 20.1 89.7 22.2 93.7 26.3 C97.8 30.4 99.4 37.1 101.7 42.7 C103.9 48.4 106.3 53.9 107.2 60.0 C108.0 66.1 109.6 74.2 107.0 79.5 C104.5 84.8 96.7 87.9 91.9 91.9 C87.0 95.9 83.3 101.3 78.0 103.5 C72.7 105.6 66.0 105.0 60.0 105.0 C54.0 104.9 47.4 105.3 42.1 103.2 C36.8 101.0 32.8 95.9 28.1 91.9 C23.4 87.9 16.5 84.3 14.1 79.0 C11.6 73.7 13.1 66.3 13.3 60.0 C13.5 53.7 12.8 46.8 15.2 41.5 C17.7 36.1 23.4 31.9 27.9 27.9 C32.5 24.0 37.1 20.1 42.5 17.7 C47.8 15.3 54.2 13.7 60.0 13.8Z"/>
        <circle cx="60" cy="60" r="36" fill="url(#wax-pressed)"/>
        <circle cx="59.2" cy="59.2" r="36" fill="none" stroke="#06122b" stroke-width="2.2" stroke-opacity="0.8"/>
        <circle cx="60.8" cy="60.8" r="36" fill="none" stroke="#a9c4ee" stroke-width="1.1" stroke-opacity="0.45"/>
        <circle cx="60" cy="60" r="31" fill="none" stroke="#0d2250" stroke-width="2" stroke-linecap="round" stroke-dasharray="0.1 4.06"/>
        <!-- מגן דוד ו-13 בזהב, כמו עלה זהב מוטבע בשעווה -->
        <use href="#seal-emblem" x="-0.45" y="-0.45" width="120" height="120" color="#06122b" opacity="0.8"/>
        <use href="#seal-emblem" x="0.4" y="0.4" width="120" height="120" color="#fbe3a6" opacity="0.6"/>
        <use href="#seal-emblem" width="120" height="120" color="#d4a84f"/>
        <ellipse cx="42" cy="34" rx="15" ry="7" fill="url(#wax-gloss)" transform="rotate(-32 42 34)"/>
      </symbol>

      <symbol id="flourish" viewBox="0 0 240 28">
        <path d="M18 16 C 44 16, 58 6, 74 12 C 82 15, 80 22, 73 20 M74 12 L 104 12"/>
        <path d="M222 16 C 196 16, 182 6, 166 12 C 158 15, 160 22, 167 20 M166 12 L 136 12"/>
        <path fill="currentColor" stroke="none" d="M120 22 C 111 15.5 108.5 10 112.6 7.2 C 115.4 5.3 118.8 6.7 120 9.6 C 121.2 6.7 124.6 5.3 127.4 7.2 C 131.5 10 129 15.5 120 22 Z"/>
      </symbol>

      <symbol id="icon-torah" viewBox="0 0 64 64">
        <rect x="8" y="15" width="9" height="34" rx="2.5"/>
        <rect x="47" y="15" width="9" height="34" rx="2.5"/>
        <path d="M12.5 15 V9 M12.5 49 V55 M51.5 15 V9 M51.5 49 V55"/>
        <circle cx="12.5" cy="7" r="2"/>
        <circle cx="12.5" cy="57" r="2"/>
        <circle cx="51.5" cy="7" r="2"/>
        <circle cx="51.5" cy="57" r="2"/>
        <path d="M17 19 Q32 23 47 19 M17 45 Q32 49 47 45"/>
        <path d="M23 28 H41 M23 33.5 H41 M23 39 H35"/>
      </symbol>

      <symbol id="icon-glasses" viewBox="0 0 64 64">
        <g transform="translate(21 33) rotate(15)">
          <path d="M-9 -15 H9 Q9 2 0 4 Q-9 2 -9 -15 Z"/>
          <path d="M-8.6 -7 Q-3 -10 2 -7 T8.6 -7"/>
          <path d="M0 4 V21 M-7 21 H7"/>
        </g>
        <g transform="translate(43 33) rotate(-15)">
          <path d="M-9 -15 H9 Q9 2 0 4 Q-9 2 -9 -15 Z"/>
          <path d="M-8.6 -7 Q-3 -10 2 -7 T8.6 -7"/>
          <path d="M0 4 V21 M-7 21 H7"/>
        </g>
        <path d="M32 5 V10 M25.5 7 L27.5 11.5 M38.5 7 L36.5 11.5"/>
      </symbol>
    </defs>
  </svg>

  <!-- מעטפה שנפתחת לפני ההזמנה. נגיעה בה פותחת מיד -->
  <div class="intro" id="intro" aria-hidden="true">
    <span class="wash intro__wash intro__wash--top"></span>
    <span class="wash intro__wash intro__wash--bottom"></span>

    <div class="envelope">
      <div class="envelope__back"></div>
      <img class="envelope__card" id="intro-card" src="images/invitation.jpg" width="1024" height="1536" alt="">
      <svg class="envelope__pocket" viewBox="0 0 100 140" preserveAspectRatio="none">
        <path class="envelope__paper" d="M0 0 L50 61 L100 0 V140 H0 Z"/>
      </svg>
      <div class="envelope__text">
        <p id="envelope-text"></p>
        <svg class="divider" aria-hidden="true"><use href="#divider"/></svg>
      </div>
      <div class="envelope__shade"></div>
      <div class="envelope__flap">
        <span class="envelope__face envelope__face--front"></span>
        <span class="envelope__face envelope__face--back"></span>
      </div>
      <div class="seal" id="seal">
        <svg class="seal__half seal__half--a" viewBox="0 0 120 120"><use href="#seal-art"/></svg>
        <svg class="seal__half seal__half--b" viewBox="0 0 120 120"><use href="#seal-art"/></svg>
      </div>
    </div>
  </div>

  <div class="draft-ribbon" id="draft-ribbon" hidden></div>

  <div class="sheet">
    <header class="hero">
      <h1 class="sr-only">בר המצווה של איתן</h1>
      <img class="hero__invitation" id="invitation" src="images/invitation.jpg" width="1024" height="1536" alt="">
    </header>

    <div class="panel">
      <span class="wash wash--top" aria-hidden="true"></span>
      <span class="wash wash--bottom" aria-hidden="true"></span>

      <div class="panel__frame">
        <figure class="portrait" id="portrait" hidden>
          <img id="photo" alt="">
        </figure>

        <section class="countdown" aria-labelledby="countdown-title">
          <h2 class="title" id="countdown-title">נפגשים בעוד</h2>
          <div class="countdown__grid" id="countdown-grid" role="timer">
            <div class="unit"><span class="unit__num" id="cd-days">0</span><span class="unit__label">ימים</span></div>
            <div class="unit"><span class="unit__num" id="cd-hours">0</span><span class="unit__label">שעות</span></div>
            <div class="unit"><span class="unit__num" id="cd-minutes">0</span><span class="unit__label">דקות</span></div>
            <div class="unit"><span class="unit__num" id="cd-seconds">0</span><span class="unit__label">שניות</span></div>
          </div>
          <p class="countdown__done" id="countdown-done" hidden>מזל טוב!</p>
          <p class="countdown__date">
            <span id="greg-date"></span>
            <span id="hebrew-date"></span>
          </p>
          <!-- רמז לגלילה: מוביל לפרטי האירוע, כדי שאף אחד לא ידלג ישר לטופס -->
          <a class="scroll-cue" id="scroll-cue" href="#details">
            <span class="scroll-cue__label">לפרטי האירוע ואישור הגעה</span>
            <svg class="scroll-cue__arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </a>
        </section>

        <svg class="divider" aria-hidden="true"><use href="#divider"/></svg>

        <section class="blessing" id="details" aria-label="ברכה">
          <div id="blessing-text"></div>
        </section>

        <svg class="divider" aria-hidden="true"><use href="#divider"/></svg>

        <section class="schedule" aria-labelledby="schedule-title">
          <h2 class="sr-only" id="schedule-title">סדר היום</h2>
          <ol class="stops" id="stops"></ol>
        </section>

        <svg class="divider" aria-hidden="true"><use href="#divider"/></svg>

        <section class="rsvp" id="rsvp" aria-labelledby="rsvp-title">
          <h2 class="title" id="rsvp-title">אישור הגעה</h2>
          <p class="rsvp__deadline" id="rsvp-deadline" hidden></p>

          <form class="form" id="rsvp-form" novalidate>
            <div class="field">
              <label class="field__label" for="f-name">שם מלא</label>
              <input class="input" id="f-name" name="name" type="text" autocomplete="name" maxlength="80">
              <p class="field__error" id="err-name" hidden></p>
            </div>

            <fieldset class="field">
              <legend class="field__label">האם תגיעו?</legend>
              <div class="choices">
                <label class="choice"><input type="radio" name="attending" value="yes"><span>מגיעים בשמחה</span></label>
                <label class="choice"><input type="radio" name="attending" value="no"><span>לצערנו לא נוכל</span></label>
              </div>
              <p class="field__error" id="err-attending" hidden></p>
            </fieldset>

            <div id="attending-details" hidden>
              <div class="field">
                <label class="field__label" for="f-count">כמה תהיו?</label>
                <div class="stepper" dir="ltr">
                  <button type="button" class="stepper__btn" id="count-minus" aria-label="פחות">&minus;</button>
                  <input class="input stepper__input" id="f-count" name="count" type="number" inputmode="numeric" min="1" max="20" value="2">
                  <button type="button" class="stepper__btn" id="count-plus" aria-label="יותר">+</button>
                </div>
                <p class="field__error" id="err-count" hidden></p>
              </div>

              <!-- כרטיס לכל חלק ביום (נבנה מ-config.js). שום דבר לא מסומן מראש, וחובה לסמן לפחות אחד -->
              <fieldset class="field">
                <legend class="field__label">לאיזה חלק תגיעו?</legend>
                <p class="field__hint parts__hint">אפשר לסמן את שניהם</p>
                <div class="parts" id="parts"></div>
                <p class="field__error" id="err-part" hidden></p>
              </fieldset>

              <div class="field">
                <label class="field__label" for="f-email">מייל לתזכורת <span class="field__optional">(רשות)</span></label>
                <input class="input" id="f-email" name="email" type="email" inputmode="email" autocomplete="email" maxlength="120" dir="ltr">
                <p class="field__hint">נשלח תזכורת אחת, יום לפני האירוע.</p>
                <p class="field__error" id="err-email" hidden></p>
              </div>
            </div>

            <div class="field">
              <label class="field__label" for="f-note">הערה <span class="field__optional">(רשות)</span></label>
              <textarea class="input" id="f-note" name="note" rows="3" maxlength="300" placeholder="למשל אלרגיות או רגישויות למזון"></textarea>
            </div>

            <div class="field--trap" aria-hidden="true">
              <label for="f-website">אין למלא שדה זה</label>
              <input id="f-website" name="website" type="text" tabindex="-1" autocomplete="off">
            </div>

            <button class="btn btn--navy btn--full" id="rsvp-submit" type="submit">שליחת אישור</button>
            <p class="form__status" id="rsvp-status" role="status" aria-live="polite"></p>
          </form>

          <div class="thanks" id="rsvp-thanks" tabindex="-1" hidden>
            <svg class="thanks__check" id="thanks-check" viewBox="0 0 48 48" aria-hidden="true" hidden>
              <circle cx="24" cy="24" r="22"/>
              <path d="M14 24.5l7 7 13-14"/>
            </svg>
            <h3 class="thanks__title" id="thanks-title"></h3>
            <p id="thanks-text"></p>

            <div class="pass" id="pass" hidden>
              <div class="pass__head">
                <p class="pass__kicker">כרטיס כניסה</p>
                <p class="pass__event" id="pass-event"></p>
                <p class="pass__date" id="pass-date"></p>
              </div>
              <div class="pass__tear" aria-hidden="true"></div>
              <div class="pass__body">
                <p class="pass__guest" id="pass-guest"></p>
                <p class="pass__count" id="pass-count"></p>
                <ul class="pass__stops" id="pass-stops"></ul>
              </div>
            </div>
            <p class="thanks__hint" id="thanks-hint" hidden>אפשר לצלם את המסך ולשמור את הכרטיס</p>

            <button type="button" class="more-candy" id="more-candy" hidden>
              לחצו כאן לעוד סוכריות <span class="more-candy__emoji" aria-hidden="true">😂</span>
            </button>


            <button type="button" class="link-btn" id="rsvp-again">שליחת תשובה נוספת</button>
          </div>
        </section>

        <footer class="closing">
          <p class="closing__line" id="closing"></p>
          <p class="closing__signature" id="signature"></p>
          <svg class="flourish" aria-hidden="true"><use href="#flourish"/></svg>
        </footer>
      </div>
    </div>
  </div>

  <script src="config.js?v=20261026b"></script>
  <script src="script.js?v=20261026b"></script>
</body>
</html>
